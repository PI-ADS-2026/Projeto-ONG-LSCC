<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Sala</title>

    <!-- Font Awesome (os ícones do seu CSS usam <i class="fa-solid ...">).
         Se as outras páginas já usam outro link/kit, mantenha o mesmo. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="tela">


        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <img src="../assets/imagens/liga-logo.png" alt="Logo da clínica">
            </div>

            <nav>
                <a href="../pages/home.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="../pages/paciente.html">
                    <i class="fa-solid fa-user"></i>
                    <span>Pacientes</span>
                </a>

                <a href="../pages/profissional.html" class="ativo">
                    <i class="fa-solid fa-user-doctor"></i>
                    <span>Profissionais</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Agendamentos</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-box"></i>
                    <span>Estoque</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-truck"></i>
                    <span>Fornecedores</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Relatórios</span>
                </a>
            </nav>

        </aside>

        <!-- CONTEÚDO -->
        <div class="conteudo">

            <header class="topo">
                <div class="topo-esquerda">
                    <button class="btn-voltar" type="button">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </button>
                </div>

                <div class="usuario">
                    <span class="usuario-perfil">Olá, Admin</span>
                    <button id="btn-trocar-conta" type="button">Trocar conta</button>
                    <button id="btn-sair" type="button">Sair</button>
                    <div class="usuario-perfil"><i class="fa-solid fa-circle-user"></i></div>
                    <button class="btn-configuracoes" type="button" aria-label="Configurações">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <section class="cabecalho-pagina">
                <div class="titulo-pagina">
                    <div class="icone-titulo"><i class="fa-solid fa-id-badge"></i></div>
                    <div class="titulo-pagina-texto">
                        <h1>Cadastro de Sala</h1>
                        <p>Gerencie as informações das salas.</p>
                    </div>
                </div>
            </section>

            <!-- Card branco do formulário -->
            <section class="painel-profissionais">
                <form class="formulario formulario-sala" action="#" method="post">

                    <div class="campo campo-sala">
                        <label for="nome">Nome:</label>
                        <input id="nome" name="nome" type="text" value="Sala 1">
                    </div>

                    <div class="campo campo-sala">
                        <label for="tamanho">Tamanho da Sala em m²:</label>
                        <input id="tamanho" name="tamanho" type="number" min="0" value="4">
                    </div>

                    <div class="campo campo-sala">
                        <label for="materiais">Materiais da Sala:</label>
                        <input id="materiais" name="materiais" type="text"
                            value="Duas poltronas, cadeira, mesa e bacia.">
                    </div>

                    <div class="linha">
                        <div class="campo cidade">
                            <label for="cidade">Cidade:</label>
                            <select id="cidade" name="cidade">
                                <option>Sorocaba</option>
                                <option>Campinas</option>
                                <option>São Paulo</option>
                            </select>
                        </div>

                        <div class="campo estado">
                            <label for="estado">Estado:</label>
                            <select id="estado" name="estado">
                                <option>São Paulo</option>
                                <option>Minas Gerais</option>
                                <option>Rio de Janeiro</option>
                            </select>
                        </div>
                    </div>

                    <div class="botoes-formulario">
                        <a href="sala.html" class="btn-cancelar">Cancelar</a>
                        <button class="btn-salvar" type="submit">Salvar</button>
                    </div>

                </form>
            </section>

        </div>
    </div>

</body>

</html>
